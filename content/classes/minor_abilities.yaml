# Minor abilities (Spec 03, "Minor abilities", and its Addendum A): the launch pools of task 4.4, 12 entries for each of
# the 20 classes (240 slots), a shared entry sitting in every pool it names. Each names its effect from the vocabulary in
# code (Spec 08, Addendum A; src/core/catalog.ts, ABILITY_EFFECTS) with the fields that effect needs; no new effect was
# needed. The first 16 are the spec's examples for the Warrior, Mage, Thief and Priest. Only entries whose effect adds up
# are stackable (pack slots, sell bonus, melee, defence, spell reach).

- id: hardy
  name: Hardy
  text: Waiting restores a Combat die in 8 rounds
  classes: [warrior, ranger, druid, necromancer, warlock, shaman, beastmaster]
  effect: wait_rounds
  amount: 8
- id: weapon_master
  name: Weapon Master
  text: +1 on melee with the weapon wielded when drawn
  classes: [warrior, knight, ranger, assassin, witch_hunter]
