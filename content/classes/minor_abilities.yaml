  classes: [warrior]
  effect: wait_rounds
  amount: 8
- id: weapon_master
  name: Weapon Master
  text: +1 on melee with the weapon wielded when drawn
  classes: [warrior]
  effect: weapon_melee
  amount: 1
- id: pack_mule
  name: Pack Mule
  text: +2 inventory slots
  classes: [warrior]
