# Minor abilities (Spec 03, "Minor abilities", and its Addendum A). These are the examples the spec gives for the
# four core classes; the full pools of 12 for all 20 classes are written in task 4.4. Each names its effect from the
# vocabulary in code (Spec 08, Addendum A; src/core/catalog.ts, ABILITY_EFFECTS) with the fields that effect needs.
- id: hardy
  name: Hardy
