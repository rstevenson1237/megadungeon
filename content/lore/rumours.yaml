# Rumour templates (Spec 07, "Rumours"; Spec 08, "Text templates"): the launch table of 60 written in task 4.9, ten for each kind of fact.
# The tavern supplies only {level} for every kind, and {artifact} for the boss kind when the boss holds one, so every boss
# template keeps at least one phrasing without {artifact}. Each phrasing states the fact and nothing more. Styled templates
# (dry, grim) stay between 13% and 18% of the table.
