- { id: graffiti_286, text: "Hell is just a poor choice of hallway.", style: dry }
- { id: graffiti_287, text: "Edges are where the wall remembers." }
- { id: graffiti_288, text: "Sleep on stone and wake up older." }
- { id: graffiti_289, text: "Nothing grows here but regret." }
- { id: graffiti_290, text: "The deeper I go, the quieter it gets." }
