# The spells (Spec 04, "Starting spell list"). Each row names an effect defined in code and carries its numbers: shape,
# reach in cells, footprint and duration. The first 15, tagged `starting`, are the list a new character's spells are drawn
# from (Spec 04); the 15 added in task 4.6 bring the table to its target of 30 and are learned from spellbooks, bought, or
# found in wands, rods and staves. Every one is built on an effect already in code.
