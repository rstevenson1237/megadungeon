# The isometric display's asset briefs (Spec 01b), generated from the content tables by `npm run art:briefs`.
# Do not edit by hand: change tools/art-briefs.ts and run it again. `batch` is the Spec 01b art batch.
- id: terrain-floor
  kind: tile
  variants: 4
  notes: flagstone floor diamond, low in contrast so creatures stand out; variants vary the worn stones. Dirt ramp only
    (the floor token). Recoloured for each of the 13 themes from its eight palette tokens.
  batch: 1
  priority: 100
  importance: standard
- id: terrain-wall
  kind: tile
  size:
    - 32
    - 40
  states:
    - full
    - cap
  notes: stone block one cell wide on a floor diamond at the frame bottom, 24 px above the floor; the cap is the cut-away
    near wall, 4 px high. Stone ramp only (the wall token). Recoloured for each of the 13 themes from its eight palette
    tokens.
  batch: 1
  priority: 101
  importance: standard
- id: terrain-door
  kind: tile
  size:
    - 32
    - 40
  states:
    - closed
    - open
    - locked
    - sealed
    - broken
    - closed-cap
    - open-cap
    - locked-cap
    - sealed-cap
    - broken-cap
  notes: plank door in its wall cell, a stone block as the wall, 24 px high; the -cap states are the cut-away door, 4 px
    high, its state shown on top. Locked shows an iron lock plate, sealed a wax-and-chain seal, open the doorway with
    the door swung back, broken split planks. Stone ramp for the wall (the wall token), wood for the door (the door
    token), metal and accent for iron and wax. Recoloured for each of the 13 themes from its eight palette tokens.
  batch: 1
  priority: 102
  importance: standard
- id: terrain-stairs-up
  kind: tile
  size:
    - 32
    - 32
  notes: stone stair rising toward map north from a floor diamond at the frame bottom. Stone ramp (the stairs token), dirt
    for the floor round it (the floor token). Recoloured for each of the 13 themes from its eight palette tokens.
  batch: 1
  priority: 103
  importance: standard
- id: terrain-stairs-down
  kind: tile
  notes: stone stair sinking into a dark opening. Stone ramp (the stairs token), dirt for the floor round it (the floor
    token). Recoloured for each of the 13 themes from its eight palette tokens.
  batch: 1
  priority: 104
  importance: standard
- id: terrain-water-shallow
  kind: tile
  anims:
    idle:
      frames: 4
      loop: true
  notes: shallow water over visible stones, slow ripple loop. Grass ramp for the water (the shallow water token), dirt for
    the stones under it (the floor token). Recoloured for each of the 13 themes from its eight palette tokens.
  batch: 1
  priority: 105
  importance: standard
- id: terrain-water-deep
  kind: tile
  anims:
    idle:
      frames: 4
      loop: true
  notes: deep dark water, slow ripple loop. Grass ramp only (the deep water token). Recoloured for each of the 13 themes
    from its eight palette tokens.
  batch: 1
  priority: 106
  importance: standard
- id: terrain-lava
  kind: tile
  anims:
    idle:
      frames: 4
      loop: true
  notes: molten rock with a cooling crust, slow glow loop. Accent and glow ramps only (the lava token). Recoloured for
    each of the 13 themes from its eight palette tokens.
  batch: 1
  priority: 107
  importance: standard
- id: terrain-teleporter
  kind: prop
  height: 0.1
  anims:
    idle:
      frames: 4
      loop: true
  notes: a ring of carved stones set in the floor, faint glow loop. Stone ramp for the stones (the wall token), glow for
    the light (the accent token). Recoloured for each of the 13 themes from its eight palette tokens.
  batch: 1
  priority: 108
  importance: standard
- id: terrain-debris
  kind: prop
  height: 0.3
  variants: 3
  notes: low heap of broken masonry and rubbish, walkable. Stone ramp for masonry (the wall token), dirt for rubbish (the
    floor token). Recoloured for each of the 13 themes from its eight palette tokens.
  batch: 1
  priority: 109
  importance: standard
